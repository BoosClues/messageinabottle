<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    a { color: #C9BE9A; text-decoration: none; }
    a:hover { color: #FFFFFF; }
    @keyframes dreamTextIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes speakIn { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes noticeFade { 0% { opacity: 0; } 16% { opacity: 1; } 74% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes sheen { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @keyframes exclaimIn { 0% { opacity: 0; transform: scale(0.4) rotate(-8deg); } 55% { opacity: 1; transform: scale(1.18) rotate(3deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    @font-face { font-family: 'Necrofonticon'; src: url('./fonts/necrofonticon.ttf') format('truetype'); font-display: swap; }
  </style>
</helmet>
<div data-screen-label="Dream State" onClick="{{ onAdvance }}" style="position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;background:#000;font-family:'Playfair Display',Georgia,serif;cursor:{{ rootCursor }};">

  <div style="position:absolute;inset:-3%;background:#050505 url('./dream-marsh.png') center 34% / cover no-repeat;filter:{{ imageFilter }};transition:filter 1100ms ease;will-change:filter;"></div>

  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 76% 60% at 50% 46%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.5) 76%, rgba(0,0,0,0.92) 100%);"></div>

  <div style="position:absolute;left:0;right:0;top:0;height:51%;pointer-events:none;background:#000;transform:{{ lidTopTransform }};transition:transform {{ lidDuration }} cubic-bezier(0.4,0,0.2,1);will-change:transform;z-index:12;"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:51%;pointer-events:none;background:#000;transform:{{ lidBottomTransform }};transition:transform {{ lidDuration }} cubic-bezier(0.4,0,0.2,1);will-change:transform;z-index:12;"></div>

  <sc-if value="{{ awakenShown }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:40px;pointer-events:none;">
      <div style="font-style:italic;font-weight:700;font-size:clamp(25px,5.6vw,36px);line-height:1.5;letter-spacing:2px;color:#FFFFFF;text-align:center;text-wrap:pretty;max-width:600px;text-shadow:0 2px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.95), 0 0 34px rgba(0,0,0,0.85);animation:dreamTextIn 1400ms ease-out forwards;">
        You awaken to find yourself in a brackish hellscape.
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ panelShown }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:{{ panelTop }};bottom:auto;z-index:10;padding:clamp(16px,4vw,34px);max-width:min(58%,400px);display:flex;flex-direction:column;gap:20px;opacity:{{ panelOpacity }};transition:opacity 380ms ease;">
      <sc-if value="{{ narrationShown }}" hint-placeholder-val="{{ true }}">
        <div style="font-style:italic;font-weight:700;font-size:clamp(19px,4.4vw,26px);line-height:1.55;color:#FFFFFF;text-wrap:pretty;text-shadow:0 2px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.95), 0 0 34px rgba(0,0,0,0.85);animation:dreamTextIn 1000ms ease-out forwards;">
          {{ narrationLine }}
        </div>
      </sc-if>
      <sc-if value="{{ choicesShown }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:12px;animation:dreamTextIn 900ms ease-out forwards;width:fit-content;">
          <div style="font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#FFFFFF;text-shadow:0 2px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.95), 0 0 34px rgba(0,0,0,0.85);">You:</div>
          <sc-for list="{{ choices }}" as="choice" hint-placeholder-count="2">
            <div onClick="{{ choice.onPick }}" style="{{ choice.style }}" style-hover="color:#FFFFFF;border-left:2px solid #FFFFFF;">
              {{ choice.text }}
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ speechShown }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:3%;top:5%;z-index:9;max-width:min(56%,380px);text-align:center;pointer-events:none;opacity:{{ speechOpacity }};transition:opacity 380ms ease;">
      <sc-for list="{{ speechWords }}" as="word" hint-placeholder-count="5">
        <span style="display:inline-block;white-space:nowrap;margin:0 0.3em;">
          <sc-for list="{{ word.glyphs }}" as="g" hint-placeholder-count="4">
            <span style="{{ g.style }}">{{ g.ch }}</span>
          </sc-for>
        </span>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ exclaimShown }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:0;top:0;width:100%;height:100%;z-index:9;pointer-events:none;">
      <img src="./interrobang.png" alt="" style="position:absolute;right:38%;top:28%;width:clamp(20px,4vw,30px);filter:drop-shadow(0 2px 6px rgba(0,0,0,0.9));animation:exclaimIn 520ms cubic-bezier(0.34,1.56,0.64,1) 60ms both;transform-origin:bottom center;" />
      <img src="./interrobang.png" alt="" style="position:absolute;right:26%;top:21%;width:clamp(28px,5.4vw,42px);filter:drop-shadow(0 2px 6px rgba(0,0,0,0.9));animation:exclaimIn 520ms cubic-bezier(0.34,1.56,0.64,1) 240ms both;transform-origin:bottom center;" />
      <img src="./interrobang.png" alt="" style="position:absolute;right:13%;top:32%;width:clamp(17px,3.4vw,25px);filter:drop-shadow(0 2px 6px rgba(0,0,0,0.9));animation:exclaimIn 520ms cubic-bezier(0.34,1.56,0.64,1) 420ms both;transform-origin:bottom center;" />
    </div>
  </sc-if>

  <sc-if value="{{ noticeShown }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:13%;z-index:11;display:flex;justify-content:center;padding:0 28px;pointer-events:none;">
      <div style="font-size:clamp(16px,3.6vw,20px);font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#FFFFFF;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.95), 0 0 34px rgba(0,0,0,0.85);animation:noticeFade 3000ms ease-out forwards;">
        {{ noticeText }}
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  BLUR_STEPS = [26, 15, 7, 0];

  // node -> { narration, speech, choices, notice, exclaim, next, autoMs }
  SCRIPT = {
    n1: { narration: 'And surrounded by a tribe of figures with piscine qualities.', next: 'n2' },
    n2: { narration: 'One of the fishmen seems to be requesting something of you insistently.', next: 'c1' },
    c1: { choices: [
      { text: '\u201CWhere am I?\u201D', to: 'speak1' },
      { text: '\u201CWhat do you want from me?\u201D', to: 'speak1' },
    ] },
    speak1: { speech: 'You have something of ours.', narration: 'It speaks a language ancient and strange\u2026', next: 'c2' },
    c2: { choices: [
      { text: '\u201CI think you are mistaken. This is just a dream.\u201D', to: 'a1' },
      { text: '\u201CFine\u2026 (Hand over the strange cargo)\u201D', to: 'b1' },
      { text: '\u201CYou\u2019ll displease prince DAGON\u201D', necro: true, to: 'x1' },
    ] },

    a1: { speech: 'You will regret this.', narration: 'The fishman looks displeased,', next: 'a2' },
    a2: { speech: 'You will regret this.', narration: 'But sends you on your way.', next: 'sleep' },

    b1: { notice: 'Removed Totally Normal Looking Crate', autoMs: 3000, next: 'b2', onEnter: 'giveCrate' },
    b2: { narration: 'The fishman looks pleased.', next: 'b3' },
    b3: { narration: 'It presents something in return.', next: 'b4' },
    b4: { narration: 'A gift for a gift\u2026', next: 'sleep', onEnter: 'receiveGift' },

    x1: { exclaim: true, autoMs: 1500, next: 'x2' },
    x2: { exclaim: true, choices: [ { text: '\u201CWhat did I just say?\u201D', to: 'x3' } ] },
    x3: { narration: 'The fishman looks anxious.', next: 'x4' },
    x4: { narration: 'It retreats into the muck.', next: 'sleep' },
  };

  state = { lidsOpen: false, blurStep: 0, closing: false, awaken: false, node: null, fading: false };

  componentDidMount() {
    try { localStorage.setItem('pointNemo.dreamt', '1'); } catch (e) {}
    this.timers = [];
    const at = (ms, fn) => this.timers.push(setTimeout(fn, ms));
    const blink = (t, step, extra) => {
      at(t, () => this.setState({ lidsOpen: false, closing: true }));
      at(t + 300, () => this.setState({ lidsOpen: true, closing: false, blurStep: step, ...(extra || {}) }));
    };
    at(500, () => this.setState({ lidsOpen: true, blurStep: 0 }));
    blink(2300, 1);
    blink(4300, 2, { awaken: true });
    blink(7600, 3, { awaken: false, node: 'n1' });
  }

  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); clearTimeout(this.autoTimer); clearTimeout(this.fadeTimer); }

  giveCrate() {
    try {
      localStorage.setItem('cargoHoldCarriedNormalCargo', '0');
      localStorage.setItem('dream.gaveCrate', '1');
    } catch (e) {}
  }

  receiveGift() { try { localStorage.setItem('dream.receivedGift', '1'); } catch (e) {} }

  goTo(node) {
    clearTimeout(this.autoTimer);
    if (node === 'sleep') {
      try {
        localStorage.setItem('dream.completed', '1');
        localStorage.setItem('map.pendingPointNemoIntro', '1');
      } catch (e) {}
      this.setState({ node: null, closing: true, lidsOpen: false });
      this.autoTimer = setTimeout(() => { window.location.href = "./index.html"; }, 1500);
      return;
    }
    const step = this.SCRIPT[node];
    if (step && step.onEnter) this[step.onEnter]();
    this.setState({ node, fading: false });
    if (step && step.autoMs) this.autoTimer = setTimeout(() => this.goTo(step.next), step.autoMs);
  }

  // Fade the current beat out before swapping in the next one.
  transitionTo(node) {
    if (this.state.fading) return;
    this.setState({ fading: true });
    clearTimeout(this.fadeTimer);
    this.fadeTimer = setTimeout(() => this.goTo(node), 420);
  }

  onAdvance = () => {
    const step = this.SCRIPT[this.state.node];
    if (!step || step.choices || step.autoMs || !step.next) return;
    this.transitionTo(step.next);
  };

  renderVals() {
    const s = this.state;
    const step = this.SCRIPT[s.node] || {};
    let gi = 0;
    const speechWords = (step.speech || '').split(' ').filter(Boolean).map(word => ({
      glyphs: word.split('').map(ch => {
        const i = gi++;
        const seed = Math.sin((i + 1) * 12.9898) * 43758.5453;
        const r = seed - Math.floor(seed);
        return {
          ch,
          style: 'display:inline-block;opacity:0;font-family:\'Necrofonticon\',\'Playfair Display\',Georgia,serif;' +
            'font-size:clamp(26px,5.8vw,40px);line-height:1.45;color:#FFF3C9;' +
            'text-shadow:0 1px 3px rgba(0,0,0,1), 0 0 18px rgba(0,0,0,0.95), 0 0 34px rgba(255,220,150,0.35);' +
            `transform:rotate(${(r - 0.5) * 3}deg);` +
            `animation:speakIn 260ms ease-out ${140 + i * 62}ms forwards;`,
        };
      }),
    }));
    const choiceStyle = (necro) => 'font-size:clamp(19px,4.4vw,25px);line-height:1.45;cursor:pointer;padding:5px 0 5px 14px;' +
      'border-left:2px solid rgba(255,255,255,0.6);width:fit-content;' +
      (necro
        ? 'font-family:\'Necrofonticon\',\'Playfair Display\',Georgia,serif;font-size:clamp(23px,5.4vw,30px);' +
          'background:linear-gradient(100deg,#FFFFFF 12%,#9FF3FF 28%,#D9BBFF 42%,#FFF0B0 56%,#B6FFE0 70%,#FFFFFF 88%);' +
          'background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;' +
          'filter:drop-shadow(0 2px 4px rgba(0,0,0,1)) drop-shadow(0 0 16px rgba(0,0,0,0.9));' +
          'animation:sheen 3.6s linear infinite;'
        : 'font-style:italic;color:#FFFFFF;text-shadow:0 2px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.95), 0 0 34px rgba(0,0,0,0.85);');
    return {
      rootCursor: (step.next && !step.choices && !step.autoMs) ? 'pointer' : 'default',
      lidDuration: s.closing ? '240ms' : '520ms',
      lidTopTransform: s.lidsOpen ? 'translateY(-100%)' : 'translateY(0)',
      lidBottomTransform: s.lidsOpen ? 'translateY(100%)' : 'translateY(0)',
      imageFilter: `blur(${this.BLUR_STEPS[s.blurStep]}px) brightness(${1 + this.BLUR_STEPS[s.blurStep] * 0.018})`,
      awakenShown: s.awaken,
      panelTop: (step.choices && step.choices.length >= 3) ? '24%' : '31%',
      panelOpacity: s.fading ? 0 : 1,
      speechOpacity: s.fading ? 0 : 1,
      panelShown: !!(step.narration || step.choices),
      narrationShown: !!step.narration,
      narrationLine: step.narration || '',
      choicesShown: !!step.choices,
      choices: (step.choices || []).map(c => ({
        text: c.text,
        style: choiceStyle(c.necro),
        onPick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.transitionTo(c.to); },
      })),
      speechShown: !!step.speech,
      speechWords,
      exclaimShown: !!step.exclaim,
      noticeShown: !!step.notice,
      noticeText: step.notice || '',
      onAdvance: this.onAdvance,
    };
  }
}

</script>
</body>
</html>
