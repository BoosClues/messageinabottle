<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #1D1D1D; }
    a { color: #C9A24B; }
    a:hover { color: #E0BE6E; }
  </style>
</helmet>
<div onClick="{{ onTap }}" style="width:100%;height:100vh;min-height:560px;position:relative;background:{{ bgColor }};font-family:'Playfair Display',Georgia,serif;overflow:hidden;cursor:pointer;">

  <sc-if value="{{ showLine }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;">
      <div style="font-style:italic;font-weight:{{ lineWeight }};font-size:{{ lineSize }}px;letter-spacing:{{ lineSpacing }}px;color:{{ textColor }};max-width:520px;text-align:center;opacity:{{ lineOpacity }};transition:opacity {{ fadeMs }}ms ease;">
        {{ lineText }}
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showLookAround }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:50%;top:calc(50% + 76px);transform:translateX(-50%);opacity:{{ lookAroundOpacity }};transition:opacity 500ms ease;">
      <div onClick="{{ onLookAround }}" style="padding:14px 30px;border:1px solid {{ textColor }};color:{{ textColor }};font-style:italic;font-size:16px;cursor:pointer;border-radius:2px;white-space:nowrap;">
        Have a look around
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}">
    <a href="./index.html" style="position:absolute;left:50%;bottom:56px;transform:translateX(-50%);font-style:italic;font-size:15px;color:{{ textColor }};opacity:{{ backOpacity }};transition:opacity 800ms ease;">
      &larr; Back to the map
    </a>
  </sc-if>

  <div onClick="{{ stopBubble }}" style="position:fixed;right:14px;bottom:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
    <sc-if value="{{ hintOpen }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:min(240px,78vw);box-sizing:border-box;padding:10px 14px;background:rgba(20,20,20,0.88);border:1px solid rgba(107,90,58,0.55);border-radius:12px;font-family:'Playfair Display',Georgia,serif;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <span style="font-style:italic;font-size:12px;color:#F1E9D2;">Hints? Teasers?</span>
        <span style="font-style:italic;font-size:11px;color:#B7A97E;">Following along with <a href="https://instagram.com/therealboosclues" target="_blank" rel="noopener" style="color:#C9A24B;">@therealboosclues</a> starting Oct. 1</span>
        <div style="display:flex;gap:8px;margin-top:2px;">
          <a href="https://instagram.com/therealboosclues" target="_blank" rel="noopener" aria-label="Instagram" style="display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid #6B5A3A;color:#F1E9D2;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg>
          </a>
          <a href="https://www.tiktok.com/@therealboosclues" target="_blank" rel="noopener" aria-label="TikTok" style="display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid #6B5A3A;color:#F1E9D2;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.9-.6-1.5-1.6-1.6-2.72h-3.1v13.4c0 1.5-1.2 2.7-2.7 2.7s-2.7-1.2-2.7-2.7 1.2-2.7 2.7-2.7c.3 0 .6.05.85.14v-3.15a5.9 5.9 0 0 0-.85-.06 5.85 5.85 0 0 0 0 11.7 5.85 5.85 0 0 0 5.85-5.85V9.7a7.1 7.1 0 0 0 4.1 1.3V7.9c-.85 0-1.65-.27-2.55-.84z"></path></svg>
          </a>
        </div>
      </div>
    </sc-if>
    <div onClick="{{ onToggleHint }}" style="width:26px;height:26px;border-radius:50%;border:1px solid #6B5A3A;color:#B7A97E;display:flex;align-items:center;justify-content:center;font-style:italic;font-size:14px;cursor:pointer;background:rgba(20,20,20,0.55);flex-shrink:0;" style-hover="background:#6B5A3A;color:#1D1D1D;">?</div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const LINES = [
  { text: 'Cuba, eh?', size: 26, weight: 500, spacing: 0.2 },
  { text: 'I wonder what gave you that idea.', size: 24, weight: 500, spacing: 0.2 },
  { text: 'Very well.', size: 24, weight: 500, spacing: 0.2 },
  { text: 'Your skiff makes port at the great city of\u2026', size: 22, weight: 500, spacing: 0.2 },
  { text: 'HAVANA', size: 56, weight: 700, spacing: 4, final: true },
];
const FADE_MS = 1200;
const PARCHMENT = '#F1E9D2';
const INK = '#1D1D1D';
const INVERT_DELAY_MS = 900;
const LOOKAROUND_DELAY_MS = 1800;

class Component extends DCLogic {
  state = {
    hintOpen: false,
    lineIndex: 0,
    lineOpacity: 0,
    showLine: false,
    locked: false,
    inverted: false,
    showLookAround: false,
    lookAroundOpacity: 0,
    showBack: false,
    backOpacity: 0,
  };

  timers = [];

  componentDidMount() {
    try { localStorage.setItem('voyage.checkpoint', 'havana'); } catch (e) {}
    this.after(40, () => this.setState({ showLine: true, lineOpacity: 1 }));
  }

  componentWillUnmount() {
    this.timers.forEach(clearTimeout);
  }

  after = (ms, fn) => {
    const id = setTimeout(fn, ms);
    this.timers.push(id);
  };

  isFinal = () => !!LINES[this.state.lineIndex].final;

  onTap = () => {
    if (this.state.locked) return;

    if (this.isFinal()) return;

    this.setState({ locked: true, lineOpacity: 0 });
    this.after(FADE_MS, () => {
      const next = this.state.lineIndex + 1;
      this.setState({ lineIndex: next, lineOpacity: 1, locked: false });
      if (LINES[next].final) {
        this.after(INVERT_DELAY_MS, () => {
          this.setState({ inverted: true });
          this.after(LOOKAROUND_DELAY_MS, () => {
            this.setState({ showLookAround: true });
            this.after(40, () => this.setState({ lookAroundOpacity: 1 }));
          });
        });
      }
    });
  };

  onLookAround = (e) => {
    e.stopPropagation();
    window.location.href = "./havana-dock.html";
  };

  stopBubble = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };

  onToggleHint = () => this.setState(s => ({ hintOpen: !s.hintOpen }));

  renderVals() {
    const line = LINES[this.state.lineIndex] || LINES[0];
    const isFinal = this.isFinal();
    return {
      stopBubble: this.stopBubble,
      hintOpen: this.state.hintOpen,
      onToggleHint: this.onToggleHint,
      showLine: this.state.showLine,
      lineText: line.text,
      lineSize: line.size,
      lineWeight: line.weight,
      lineSpacing: line.spacing,
      lineOpacity: this.state.lineOpacity,
      fadeMs: isFinal ? 0 : FADE_MS,
      isFinal: isFinal,
      bgColor: (isFinal && this.state.inverted) ? PARCHMENT : INK,
      textColor: (isFinal && this.state.inverted) ? INK : PARCHMENT,
      showLookAround: this.state.showLookAround,
      lookAroundOpacity: this.state.lookAroundOpacity,
      onLookAround: this.onLookAround,
      showBack: this.state.showBack,
      backOpacity: this.state.backOpacity,
      onTap: this.onTap,
    };
  }
}

</script>
</body>
</html>
